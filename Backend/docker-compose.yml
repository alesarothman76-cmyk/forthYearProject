version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: alzheimer_system_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: alzheimer_system
      POSTGRES_USER: alzheimer_dev
      POSTGRES_PASSWORD: devpass123
    ports:
      - "5432:5432"
    volumes:
      - alzheimer_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alzheimer_dev -d alzheimer_system"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  alzheimer_pgdata:
